services:
  mysql:
    image: mysql:8.0
    container_name: hike-planner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: hike_planner
    ports:
      - "3306:3306"
    volumes:
      - hike_planner_mysql:/var/lib/mysql

volumes:
  hike_planner_mysql:
